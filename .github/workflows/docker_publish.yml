name: Publish Docker image

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  push_images_to_registry:
    name: Prepare Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ARGUMENTS:
          - PACKAGES_LIST: bash
            SUFFIX: ''
            SCALA_VERSION: ''
            INSTALL_COURSIER: false
          - PACKAGES_LIST: bash openjdk17-jre
            SUFFIX: -java17
            SCALA_VERSION: ''
            INSTALL_COURSIER: false
          - PACKAGES_LIST: bash openjdk21-jre
            SUFFIX: -java21
            SCALA_VERSION: ''
            INSTALL_COURSIER: false
          - PACKAGES_LIST: 'bash openjdk17-jre maven'
            SUFFIX: -java17-maven
            SCALA_VERSION: ''
            INSTALL_COURSIER: false
          - PACKAGES_LIST: 'bash openjdk21-jre maven'
            SUFFIX: -java21-maven
            SCALA_VERSION: ''
            INSTALL_COURSIER: false
          - PACKAGES_LIST: 'bash openjdk17-jre curl'
            SUFFIX: -scala2.12-sbt
            SCALA_VERSION: '2.12.20' # Specify exact Scala version
            INSTALL_COURSIER: true
          - PACKAGES_LIST: 'bash openjdk17-jre curl'
            SUFFIX: -scala2.13-sbt
            SCALA_VERSION: '2.13.14' # Specify exact Scala version
            INSTALL_COURSIER: true
          - PACKAGES_LIST: 'bash openjdk17-jre curl' # Added curl, removed wget
            SUFFIX: -scala3-sbt
            SCALA_VERSION: '3.3.3'
            INSTALL_COURSIER: true

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker base Image
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: vijayjangir/pre-commit
          flavor: |
            latest=auto
            suffix=${{ matrix.ARGUMENTS.SUFFIX }},onlatest=true

          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64 # Specify target platforms
          build-args: |
            PACKAGES_LIST=${{ matrix.ARGUMENTS.PACKAGES_LIST }}
            SCALA_VERSION=${{ matrix.ARGUMENTS.SCALA_VERSION }}
            INSTALL_COURSIER=${{ matrix.ARGUMENTS.INSTALL_COURSIER }} # Pass Coursier flag
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  upload_metadata:
    runs-on: ubuntu-latest
    needs: push_images_to_registry
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_README }}
          repository: vijayjangir/pre-commit
